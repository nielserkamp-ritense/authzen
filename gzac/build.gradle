 *
 * The released GZAC application (ritense/gzac-backend), carrying the AuthZEN
 * authorization module. Standalone build: the valtimo modules below are
 * resolved from the ../valtimo checkout through the composite build declared in
 * settings.gradle, not from a Maven repository.
 */

plugins {
    id "war"
    id "org.jetbrains.kotlin.jvm" version "${kotlinVersion}"
    id "org.jetbrains.kotlin.plugin.spring" version "${kotlinVersion}"
    id "org.springframework.boot" version "${springBootVersion}"
}

version = valtimoVersion

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation(platform("com.ritense.valtimo:valtimo-dependency-versions:$valtimoVersion"))

    implementation("com.ritense.valtimo:valtimo-gzac-dependencies:$valtimoVersion")
    implementation("com.ritense.valtimo:local-mail:$valtimoVersion")
    implementation("com.ritense.valtimo:smartdocuments:$valtimoVersion")
    implementation("com.ritense.valtimo:portaaltaak:$valtimoVersion")
    implementation("com.ritense.valtimo:outbox-rabbitmq:$valtimoVersion")
    implementation("com.ritense.valtimo:process-link-url:$valtimoVersion")
    implementation("com.ritense.valtimo:authorization-authzen:$valtimoVersion")

    // Plugins
    implementation("com.ritense.valtimoplugins:freemarker:$freemarkerPluginVersion")
    implementation("com.ritense.valtimoplugins:smtpmail:$smtpmailPluginVersion")
    implementation("com.ritense.valtimoplugins:object-management:$objectmanagementPluginVersion")

    implementation("io.github.oshai:kotlin-logging")
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation "org.springframework.boot:spring-boot-starter-security"

    // Spring cloud stream RabbitMQ
    implementation "org.springframework.cloud:spring-cloud-starter-stream-rabbit:${springCloudStreamVersion}"
    implementation "com.rabbitmq:amqp-client:$amqpCLientVersion"

    // Database
    implementation "org.postgresql:postgresql:$postgresqlDriverVersion"
    implementation "com.mysql:mysql-connector-j:$mysqlDriverVersion"

    if (System.getProperty("os.arch") == "aarch64") {
        runtimeOnly("io.netty:netty-resolver-dns-native-macos::osx-aarch_64")
    }

    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
}

springBoot {
    mainClass = "com.ritense.valtimo.ApplicationKt"
}

// The image only needs the executable (boot) war. Disable the plain `war`
// archive so the Dockerfile's gzac-*.war glob resolves to exactly one file.
tasks.named("war") { enabled = false }

// Load .env.properties into bootRun's environment when present.
tasks.named("bootRun") {
    doFirst {
        File f = project.file(".env.properties")
        if (f.isFile()) {
            def props = new Properties()
            f.withInputStream { props.load(it) }
            props.each { key, value -> environment(key.toString(), value.toString()) }
        }
    }
}
