# The version valtimo's projects publish under. The composite build in
# settings.gradle substitutes the coordinates with the local projects regardless
# of the value, but keep it in sync with valtimo/gradle.properties:projectVersion
# so the resolved graph reads correctly and the war is named gzac-<version>.war
# (the Dockerfile globs gzac-*.war).
valtimoVersion=13.1.3

# Plugin versions — keep in sync with valtimo/gradle.properties.
kotlinVersion=2.1.21
springBootVersion=3.5.16

# Dependency versions not constrained by the valtimo-dependency-versions platform.
springCloudStreamVersion=4.2.1
amqpCLientVersion=5.29.0
postgresqlDriverVersion=42.7.11
mysqlDriverVersion=9.7.0
freemarkerPluginVersion=8.5.5
smtpmailPluginVersion=2.0.8
objectmanagementPluginVersion=1.2.3

# The included valtimo build is large; it needs the same heap it gives itself.
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError
